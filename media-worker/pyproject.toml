[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipador-media-worker"
version = "0.1.0"
description = "Reliable media processing worker for Clipador"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "faster-whisper==1.2.1",
  "opencv-python-headless==4.14.0.94",
  "pika==1.4.4",
  "pydantic==2.13.4",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
